<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronoff - Code Runner Online/Offline</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#14171c">
<meta name="author" content="yehon106">
<!-- Cronoff: made by yehon106 -->
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
<style>
  :root {
    --bg: #14171c; --bar: #1b1f26; --edit: #1d2128; --line: #2b313b;
    --ink: #e3e8ef; --muted: #8590a2; --accent: #19b5c8; --accent-ink: #06222a;
    --out: #0f1216; --err: #ff7b8a; --info: #6f7e96;
    --k: #c792ea; --b: #82aaff; --s: #f0c674; --n: #f78c6c; --c: #5c6773;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--bar); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: -0.02em; margin-right: 10px; display: flex; align-items: center; gap: 8px; }
  .by { font-size: 12px; font-weight: 600; color: var(--muted); margin-right: 10px; white-space: nowrap; }
  .brand small { font-size: 12px; font-weight: 500; letter-spacing: 0; color: var(--muted); margin-left: 4px; }
  @media (max-width: 900px) { .brand small { display: none; } }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 8px 0 0 -3px var(--s); margin-right: 6px; }
  button { font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 7px 14px; border-radius: 6px; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #code:focus, #code:focus-visible { outline: none; }
  #lang { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--edit); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer; }
  #lang:disabled { opacity: .4; cursor: not-allowed; }
  #run { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); padding: 7px 22px; }
  #status { margin-left: auto; font-size: 13px; color: var(--muted); }

  main { flex: 1; min-height: 0; display: flex; }
  main[data-layout="right"]  { flex-direction: row; }
  main[data-layout="left"]   { flex-direction: row-reverse; }
  main[data-layout="bottom"] { flex-direction: column; }
  main[data-layout="top"]    { flex-direction: column-reverse; }
  section { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #editorSec { flex: 1 1 0; }
  #outSec { flex: 0 0 50%; }
  #resizer { flex: 0 0 7px; background: var(--line); touch-action: none; }
  #resizer:hover, #resizer.drag { background: var(--accent); }
  main[data-layout="right"] #resizer, main[data-layout="left"] #resizer { cursor: col-resize; }
  main[data-layout="top"] #resizer, main[data-layout="bottom"] #resizer { cursor: row-resize; }
  main.dragging { user-select: none; }

  .tab { padding: 8px 14px; font-size: 13px; color: var(--muted); background: var(--bar); border-bottom: 1px solid var(--line); display: flex; align-items: center; }
  .tab b { color: var(--ink); font-weight: 600; border-bottom: 2px solid var(--accent); padding-bottom: 6px; margin-bottom: -9px; }
  #tabs { gap: 2px; padding: 0 8px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; white-space: nowrap; }
  #tabs::-webkit-scrollbar { display: none; }
  .ftab { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; padding: 8px 10px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; }
  .ftab:hover { color: var(--ink); }
  .ftab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .ftab .x { border: 0; padding: 0 5px; font-size: 16px; font-weight: 400; line-height: 1.2; color: var(--muted); }
  .ftab .x:hover:not(:disabled) { color: var(--err); }
  #tabs #newTab { flex: 0 0 auto; border: 0; padding: 4px 10px; font-size: 18px; line-height: 1; color: var(--muted); align-self: center; }
  #fnameInput { font: inherit; font-weight: 600; color: var(--ink); background: var(--edit); border: 1px solid var(--accent); border-radius: 4px; padding: 2px 6px; width: 190px; max-width: 100%; outline: none; }
  #clear { margin-left: auto; padding: 2px 10px; font-size: 12px; }
  .mono { font: 400 14.5px/1.6 ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; tab-size: 4; }
  .editor { flex: 1; min-height: 0; display: flex; background: var(--edit); }
  #gutter { width: 52px; padding: 14px 10px 14px 0; text-align: right; color: #566074; overflow: hidden; user-select: none; white-space: pre; border-right: 1px solid var(--line); }
  .codewrap { position: relative; flex: 1; min-width: 0; }
  #hl, #code { position: absolute; inset: 0; margin: 0; padding: 14px 14px 40px 14px; white-space: pre; border: 0; }
  #hl { overflow: hidden; pointer-events: none; color: var(--ink); }
  #code { background: transparent; color: transparent; caret-color: var(--ink); resize: none; overflow-x: hidden; overflow-y: auto; width: 100%; height: 100%; }
  #code::selection { background: #2f4a6b; color: transparent; }
  #hl .k { color: var(--k); } #hl .b { color: var(--b); } #hl .s { color: var(--s); }
  #hl .n { color: var(--n); } #hl .c { color: var(--c); font-style: italic; }
  #stdinBox { display: none; width: 100%; box-sizing: border-box; resize: vertical; font: inherit; font-size: 13px; padding: 6px 10px; color: var(--ink); background: var(--edit); border: 0; border-bottom: 1px solid var(--line); outline: none; }
  #gfxWrap { display: none; flex: 0 0 auto; max-height: 75%; overflow: auto; background: #000; border-bottom: 1px solid var(--line); }
  #gfx { display: block; max-width: 100%; height: auto; margin: 0 auto; outline: none; background: #000; }
  #out { flex: 1; min-width: 0; margin: 0; padding: 14px; background: var(--out); overflow-x: hidden; overflow-y: auto; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
  #out .err { color: var(--err); } #out .info { color: var(--info); }
  #inputRow { display: none; background: var(--out); border-top: 1px solid var(--line); padding: 8px 14px; gap: 8px; align-items: center; color: var(--muted); }
  #inputRow.show { display: flex; }
  #inputEl { flex: 1; min-width: 0; background: var(--edit); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
  #send { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); padding: 6px 14px; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot" aria-hidden="true"></span>Cronoff<small>Code runner &middot; online/offline</small></div>
  <span class="by" title="Made by yehon106">by yehon106</span>
  <select id="lang" aria-label="Language" title="Change language (renames the file extension)"><option value="" disabled hidden>Language</option></select>
  <button id="run" disabled>Run</button>
  <button id="stop" disabled>Stop</button>
  <button id="download">Download</button>
  <button id="rotate" title="Move the output panel">Output: Right</button>
  <button id="reset">Reset</button>
  <span id="status">Loading Cronoff...</span>
</header>
<main id="main" data-layout="right">
  <section id="editorSec">
    <div class="tab" id="tabs" role="tablist"></div>
    <div class="editor">
      <div id="gutter" class="mono" aria-hidden="true"></div>
      <div class="codewrap">
        <pre id="hl" class="mono" aria-hidden="true"></pre>
        <textarea id="code" class="mono" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code (Ctrl+Enter to run)"></textarea>
      </div>
    </div>
  </section>
  <div id="resizer" role="separator" aria-label="Drag to resize"></div>
  <section id="outSec">
    <div class="tab"><b>Output</b><button id="clear">Clear</button></div>
    <textarea id="stdinBox" rows="2" placeholder="Program input for this language (one line per input). It is sent when you press Run." aria-label="Program input"></textarea>
    <div id="gfxWrap"><canvas id="gfx" width="640" height="480" tabindex="0" aria-label="Graphics window"></canvas></div>
    <pre id="out" class="mono" aria-live="polite"></pre>
    <div id="inputRow" class="mono">
      <span>input:</span>
      <input id="inputEl" class="mono" autocomplete="off" spellcheck="false" aria-label="Input">
      <button id="send">Send</button>
    </div>
  </section>
</main>

<script id="w-common" type="text/plain">
// Make sure every console method exists (some browsers or extensions remove some).
for (const m of ["log", "info", "debug", "warn", "error", "trace", "group", "groupEnd", "groupCollapsed", "count", "countReset", "dir", "dirxml", "table", "time", "timeLog", "timeEnd", "assert", "clear"]) {
  if (typeof console[m] !== "function") console[m] = () => {};
}
let i32, bytes;
const dec = new TextDecoder();
function mk(err) {
  const b = [];
  const d = new TextDecoder();
  const flush = () => {
    if (b.length) postMessage({ type: "out", err, text: d.decode(new Uint8Array(b.splice(0)), { stream: true }) });
  };
  return { flush, handle: (c) => { b.push(c & 255); if ((c & 255) === 10) flush(); } };
}
const O = mk(false), E = mk(true);

// Text output for runtimes that give us strings (JavaScript, SQL, Lua). Batched so big loops stay fast.
let obuf = "", oerr = false, otimer = 0;
function flushOut() {
  if (otimer) { clearTimeout(otimer); otimer = 0; }
  if (obuf) { postMessage({ type: "out", err: oerr, text: obuf }); obuf = ""; }
}
function emit(text, err) {
  err = !!err;
  if (obuf && oerr !== err) flushOut();
  oerr = err;
  obuf += text;
  if (obuf.length > 4096) flushOut();
  else if (!otimer) otimer = setTimeout(flushOut, 16);
}

// ---- Graphics window: drawing commands are batched and sent to the page's canvas. ----
let gi32 = null, gkeys = null, gq = [], gW = 640, gH = 480, gPoly = 0;
function snd(cmd) { postMessage({ type: "snd", cmd }); }
function gfxPush(c) { gq.push(c); if (gq.length > 4000) gfxFlush(); }
function gfxFlush() { if (gq.length) { postMessage({ type: "gfx", cmds: gq }); gq = []; } }
const GKEYS = { left: 37, up: 38, right: 39, down: 40, space: 32, enter: 13, escape: 27, esc: 27, shift: 16, ctrl: 17, tab: 9, backspace: 8 };
// gfx.* works the same from Python, Lua and Ruby (positional arguments only).
const gfxApi = {
  window(w, h) { gW = Math.min(4096, Math.max(1, w | 0 || 640)); gH = Math.min(4096, Math.max(1, h | 0 || 480)); gfxPush(["size", gW, gH]); },
  clear(c) { gfxPush(["set", "fillStyle", c || "#000"]); gfxPush(["ctx", "fillRect", [0, 0, gW, gH]]); },
  color(c, g, b) {
    if (g !== undefined) c = "rgb(" + c + "," + g + "," + b + ")";
    gfxPush(["set", "fillStyle", c]); gfxPush(["set", "strokeStyle", c]);
  },
  line_width(n) { gfxPush(["set", "lineWidth", n]); },
  line(x1, y1, x2, y2) {
    gfxPush(["ctx", "beginPath", []]); gfxPush(["ctx", "moveTo", [x1, y1]]);
    gfxPush(["ctx", "lineTo", [x2, y2]]); gfxPush(["ctx", "stroke", []]);
  },
  rect(x, y, w, h, fill) { gfxPush(["ctx", fill === false ? "strokeRect" : "fillRect", [x, y, w, h]]); },
  circle(x, y, r, fill) {
    gfxPush(["ctx", "beginPath", []]); gfxPush(["ctx", "arc", [x, y, r, 0, Math.PI * 2]]);
    gfxPush(["ctx", fill === false ? "stroke" : "fill", []]);
  },
  text(s, x, y, size) {
    gfxPush(["set", "font", (size || 16) + "px sans-serif"]);
    gfxPush(["set", "textBaseline", "top"]);
    gfxPush(["ctx", "fillText", [String(s), x, y]]);
  },
  ellipse(x, y, rx, ry, fill) {
    gfxPush(["ctx", "beginPath", []]); gfxPush(["ctx", "ellipse", [x, y, rx, ry, 0, 0, Math.PI * 2]]);
    gfxPush(["ctx", fill === false ? "stroke" : "fill", []]);
  },
  poly_begin() { gfxPush(["ctx", "beginPath", []]); gPoly = 0; },
  poly_point(x, y) { gfxPush(["ctx", gPoly++ ? "lineTo" : "moveTo", [x, y]]); },
  poly_end(fill) { gfxPush(["ctx", "closePath", []]); gfxPush(["ctx", fill === false ? "stroke" : "fill", []]); },
  gradient(x1, y1, x2, y2, c1, c2) { gfxPush(["grad", x1, y1, x2, y2, c1, c2]); },   // next fills/lines use it
  picture(url) { gfxPush(["pic", String(url)]); },                                    // shows a picture (matplotlib uses this)
  image(url, x, y, w, h) { gfxPush(["img", String(url), x, y, w, h]); },              // draws once the picture has loaded
  beep(freq, ms, vol, wave) { snd(["beep", freq || 440, ms || 150, vol === undefined ? 0.2 : vol, wave || "square"]); },
  keycode(n) { return !!(gkeys && Atomics.load(gkeys, n & 255)); },
  mouse_buttons() { return gi32 ? Atomics.load(gi32, 2) : 0; },
  flip() { gfxFlush(); },
  sleep(sec) { gfxFlush(); Atomics.wait(gi32, 3, 0, Math.max(0, (sec || 0) * 1000)); },
  key(name) {
    const n = String(name).toLowerCase();
    const k = GKEYS[n] !== undefined ? GKEYS[n] : n.toUpperCase().charCodeAt(0);
    return !!(gkeys && Atomics.load(gkeys, k & 255));
  },
  mouse_x() { return gi32 ? Atomics.load(gi32, 0) : 0; },
  mouse_y() { return gi32 ? Atomics.load(gi32, 1) : 0; },
  mouse_down() { return !!(gi32 && (Atomics.load(gi32, 2) & 1)); },
};

// Blocks until the page sends a line of input (SharedArrayBuffer + Atomics).
function readLine() {
  O.flush(); E.flush(); flushOut(); gfxFlush();
  postMessage({ type: "input" });
  Atomics.wait(i32, 0, 0);
  const n = i32[1];
  const s = dec.decode(bytes.slice(0, n));
  Atomics.store(i32, 0, 0);
  return s;
}

// Each language file below defines LANG = { init(): label, run(code) }.
onmessage = async (ev) => {
  const m = ev.data;
  if (m.type === "init") {
    i32 = new Int32Array(m.sab);
    bytes = new Uint8Array(m.sab, 8);
    if (m.gsab) { gi32 = new Int32Array(m.gsab, 0, 4); gkeys = new Uint8Array(m.gsab, 16, 256); }
    try {
      const label = await LANG.init();
      postMessage({ type: "ready", version: label });
    } catch (e) {
      postMessage({ type: "fail", text: String(e) });
    }
  } else if (m.type === "ev") {
    if (self.__gfxEvent) self.__gfxEvent(m.ev);
  } else if (m.type === "run") {
    try {
      await LANG.run(m.code, m.canvas);
    } catch (e) {
      O.flush(); flushOut();
      postMessage({ type: "out", err: true, text: String((e && e.message) || e) + "\n" });
    } finally {
      O.flush(); E.flush(); flushOut(); gfxFlush();
      postMessage({ type: "done" });
    }
  }
};
</script>

<script id="w-py" type="text/plain">
let pyodide;
const LANG = {
  async init() {
    importScripts("https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js");
    pyodide = await loadPyodide();
    pyodide.setStdout({ raw: O.handle });
    pyodide.setStderr({ raw: E.handle });
    pyodide.setStdin({ stdin: () => readLine() });
    pyodide.registerJsModule("gfx", gfxApi);   // import gfx
    // each look-alike gets its own namespace so their helpers do not clash
    pyodide.runPython(PYGAME, { globals: pyodide.globals.get("dict")() });   // import pygame
    pyodide.runPython(TURTLE, { globals: pyodide.globals.get("dict")() });   // import turtle
    pyodide.runPython(PREP);                   // time.sleep, requests, matplotlib, asyncio.run helpers
    return "Python " + pyodide.version;
  },
  async run(code) {
    const g = pyodide.globals.get("dict")();
    g.set("__name__", "__main__");             // so `if __name__ == "__main__":` runs
    try {
      // pygame, turtle and gfx are built in here; do not download the real ones
      let found = [];
      try { found = pyodide.pyodide_py.code.find_imports(code).toJs(); } catch (e) {}
      const need = found.filter((n) => !["pygame", "turtle", "gfx"].includes(n));
      if (need.length) await pyodide.loadPackagesFromImports(need.map((n) => "import " + n).join("\n"));
      code = await pyodide.globals.get("_cronoff_prep")(code);
      await pyodide.runPythonAsync(code, { globals: g });
    } catch (e) {
      const msg = String((e && e.message) || e);
      const last = msg.trim().split("\n").pop();
      if (/^SystemExit/.test(last)) return;    // sys.exit() / exit() end the program quietly
      if (/No module named 'tkinter'/.test(last)) throw new Error(msg + "\n\ntkinter does not work in the browser. For windows use turtle, pygame or gfx instead.");
      if (/^ModuleNotFoundError/.test(last)) throw new Error(msg + "\n\nTip: for pure-Python packages from PyPI run this first:\nimport micropip\nawait micropip.install('package-name')");
      throw e;
    } finally {
      g.destroy();
    }
  },
};
</script>

<script id="w-js" type="text/plain">
const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;

// Prints values roughly the way Node does: strings raw at the top level, objects expanded.
function ins(v, d, seen) {
  if (typeof v === "string") return d ? "'" + v + "'" : v;
  if (v === null || v === undefined) return String(v);
  if (typeof v === "bigint") return v + "n";
  if (typeof v === "function") return "[Function" + (v.name ? ": " + v.name : " (anonymous)") + "]";
  if (typeof v === "symbol") return v.toString();
  if (typeof v !== "object") return String(v);
  if (v instanceof Error) return d ? "[" + v.name + ": " + v.message + "]" : v.name + ": " + v.message;
  if (v instanceof Date) return isNaN(v) ? "Invalid Date" : v.toISOString();
  if (seen.indexOf(v) >= 0) return "[Circular]";
  if (d > 3) return Array.isArray(v) ? "[Array]" : "[Object]";
  seen = seen.concat([v]);
  const q = (x) => ins(x, d + 1, seen);
  let items, pre = "", open = "{", close = "}";
  if (Array.isArray(v)) { items = v.map(q); open = "["; close = "]"; }
  else if (v instanceof Map) { pre = "Map(" + v.size + ") "; items = Array.from(v, (e) => q(e[0]) + " => " + q(e[1])); }
  else if (v instanceof Set) { pre = "Set(" + v.size + ") "; items = Array.from(v, q); }
  else {
    items = Object.keys(v).map((k) => (/^[A-Za-z_$][\w$]*$/.test(k) ? k : "'" + k + "'") + ": " + q(v[k]));
    const cn = v.constructor && v.constructor.name;
    if (cn && cn !== "Object") pre = cn + " ";
  }
  if (!items.length) return pre + open + close;
  const one = pre + open + " " + items.join(", ") + " " + close;
  if (one.length <= 72 && one.indexOf("\n") < 0) return one;
  const pad = "  ".repeat(d + 1);
  return pre + open + "\n" + items.map((s) => pad + s).join(",\n") + "\n" + "  ".repeat(d) + close;
}
function report(e) {
  emit((e && e.name ? e.name + ": " + e.message : ins(e, 0, [])) + "\n", true);
}

const LANG = {
  async init() {
    self.addEventListener("unhandledrejection", (ev) => { ev.preventDefault(); report(ev.reason); });
    return "JavaScript";
  },
  async run(code, off) {
    const say = (err) => (...a) => emit(a.map((x) => ins(x, 0, [])).join(" ") + "\n", err);
    const clocks = {};
    const con = {
      log: say(false), info: say(false), debug: say(false), dir: say(false), table: say(false),
      error: say(true), warn: say(true), clear() {},
      assert(ok, ...a) { if (!ok) emit("Assertion failed" + (a.length ? ": " + a.map((x) => ins(x, 0, [])).join(" ") : "") + "\n", true); },
      time(l = "default") { clocks[l] = performance.now(); },
      timeEnd(l = "default") { if (l in clocks) { emit(l + ": " + (performance.now() - clocks[l]).toFixed(3) + "ms\n", false); delete clocks[l]; } },
    };
    const inp = (p) => { if (p !== undefined) emit(String(p)); return readLine(); };
    const alertFn = (x) => emit(String(x) + "\n");

    // Timers are tracked so the run only "finishes" once nothing is left scheduled.
    const live = new Map();
    let nid = 1, waiter = null;
    const check = () => { if (!live.size && waiter) { const w = waiter; waiter = null; w(); } };
    const stopHandle = (h) => {
      if (h && h.raf !== undefined) self.cancelAnimationFrame(h.raf);
      else { clearTimeout(h); clearInterval(h); }
    };
    const st = (fn, ms, ...a) => {
      const id = nid++;
      live.set(id, setTimeout(async () => {
        live.delete(id);
        try { await fn(...a); } catch (e) { report(e); }
        gfxFlush();
        check();
      }, ms));
      return id;
    };
    const si = (fn, ms, ...a) => {
      const id = nid++;
      live.set(id, setInterval(() => {
        try { const r = fn(...a); if (r && r.catch) r.catch(report); } catch (e) { report(e); }
        gfxFlush();
      }, ms));
      return id;
    };
    const ct = (id) => {
      const h = live.get(id);
      if (h !== undefined) { stopHandle(h); live.delete(id); check(); }
    };

    // Windows and handlers: event listeners keep the run open until Stop, like an open window.
    const listeners = {};
    let hold = null;
    const addL = (t, f) => {
      (listeners[t] = listeners[t] || []).push(f);
      if (hold === null) { hold = nid++; live.set(hold, null); }
    };
    const rmL = (t, f) => { const a = listeners[t]; const i = a ? a.indexOf(f) : -1; if (i >= 0) a.splice(i, 1); };
    self.__gfxEvent = (e) => {
      const ev = Object.assign({ preventDefault() {}, stopPropagation() {} }, e);
      (listeners[e.type] || []).slice().forEach((f) => { try { f(ev); } catch (x) { report(x); } });
    };

    // Images and sounds (the worker has no Image / Audio, so these stand in for them).
    class Img {
      constructor(w, h) {
        this.width = w || 0; this.height = h || 0; this.naturalWidth = 0; this.naturalHeight = 0;
        this.complete = false; this.bitmap = null; this.onload = null; this.onerror = null; this._src = ""; this._l = {};
      }
      get src() { return this._src; }
      set src(u) {
        this._src = String(u); this.complete = false;
        const id = nid++; live.set(id, null);   // stay open while the picture loads
        fetch(this._src, { mode: "cors" })
          .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.blob(); })
          .then((b) => createImageBitmap(b))
          .then((bm) => {
            this.bitmap = bm; this.width = this.naturalWidth = bm.width; this.height = this.naturalHeight = bm.height;
            this.complete = true; this._fire("load");
          })
          .catch(() => this._fire("error"))
          .finally(() => { live.delete(id); check(); });
      }
      _fire(t) {
        const ev = { type: t, target: this };
        try { if (this["on" + t]) this["on" + t](ev); (this._l[t] || []).forEach((f) => f(ev)); } catch (e) { report(e); }
      }
      addEventListener(t, f) { (this._l[t] = this._l[t] || []).push(f); }
      removeEventListener() {}
      decode() { return new Promise((res, rej) => { if (this.complete) res(); else { this.addEventListener("load", () => res()); this.addEventListener("error", () => rej(new Error("image failed to load"))); } }); }
    }
    let aid = 1;
    class Aud {
      constructor(url) {
        this._id = aid++; this._src = url === undefined ? "" : String(url);
        this._p = { volume: 1, loop: false, muted: false, currentTime: 0, playbackRate: 1 };
        snd(["new", this._id, this._src]);
      }
      get src() { return this._src; }
      set src(u) { this._src = String(u); snd(["src", this._id, this._src]); }
      play() { snd(["play", this._id]); return Promise.resolve(); }
      pause() { snd(["pause", this._id]); }
      load() {}
      cloneNode() { const a = new Aud(this._src); Object.assign(a, this._p); return a; }
      addEventListener() {}
      removeEventListener() {}
    }
    for (const k of ["volume", "loop", "muted", "currentTime", "playbackRate"]) {
      Object.defineProperty(Aud.prototype, k, { get() { return this._p[k]; }, set(v) { this._p[k] = v; snd(["set", this._id, k, v]); } });
    }
    const beep = (f, ms, vol, wave) => gfxApi.beep(f, ms, vol, wave);

    // Canvas. With OffscreenCanvas it is the real thing (gradients, getImageData, WebGL, ...).
    // Without it, drawing commands are sent to the page instead (a smaller set of features).
    let canvas, ctx, doc, raf;
    const wrapCtx = (c) => new Proxy(c, {
      get(t, k) {
        if (k === "drawImage" || k === "createPattern") return (img, ...a) => t[k](img && img.bitmap ? img.bitmap : img, ...a);
        const v = t[k];
        return typeof v === "function" ? v.bind(t) : v;
      },
      set(t, k, v) { t[k] = v; return true; },
    });
    const newCanvas = () => {
      const o = new OffscreenCanvas(300, 150);
      const og = o.getContext.bind(o);
      o.getContext = (t, x) => { const c = og(t, x); return t === "2d" && c ? wrapCtx(c) : c; };
      o.style = {}; o.focus = () => {};
      return o;
    };
    if (off) {
      let shown = false;
      const show = () => { if (!shown) { shown = true; postMessage({ type: "gfxshow" }); } };
      canvas = off;
      const og = off.getContext.bind(off);
      let c2d = null;
      off.getContext = (t, x) => {
        show();
        const c = og(t, x);
        if (t !== "2d" || !c) return c;
        return c2d || (c2d = wrapCtx(c));
      };
      off.addEventListener = addL; off.removeEventListener = rmL; off.style = {}; off.focus = () => {};
      off.getBoundingClientRect = () => ({ left: 0, top: 0, width: off.width, height: off.height });
      ctx = new Proxy(function () {}, {
        get(_, k) { const c = canvas.getContext("2d"); const v = c[k]; return typeof v === "function" ? v.bind(c) : v; },
        set(_, k, v) { canvas.getContext("2d")[k] = v; return true; },
      });
      raf = (fn) => {
        if (!self.requestAnimationFrame) return st(() => fn(performance.now()), 16);
        const id = nid++;
        live.set(id, { raf: self.requestAnimationFrame(async (t) => {
          live.delete(id);
          try { await fn(t); } catch (e) { report(e); }
          check();
        }) });
        return id;
      };
      doc = {
        addEventListener: addL, removeEventListener: rmL, getElementById: () => canvas, querySelector: () => canvas, body: {},
        createElement(tag) {
          tag = String(tag).toLowerCase();
          if (tag === "canvas") return newCanvas();
          if (tag === "img") return new Img();
          if (tag === "audio") return new Aud();
          return { style: {}, addEventListener() {}, appendChild() {}, setAttribute() {} };
        },
      };
    } else {
      const GM = new Set("save restore scale rotate translate transform setTransform resetTransform beginPath closePath moveTo lineTo bezierCurveTo quadraticCurveTo arc arcTo ellipse rect roundRect fill stroke clip clearRect fillRect strokeRect fillText strokeText setLineDash".split(" "));
      const props = { fillStyle: "#000000", strokeStyle: "#000000", lineWidth: 1, font: "10px sans-serif", textAlign: "start", textBaseline: "alphabetic", globalAlpha: 1 };
      let cw = 640, ch = 480;
      ctx = new Proxy({}, {
        get(_, k) {
          if (k === "canvas") return canvas;
          if (k === "measureText") return (t) => ({ width: String(t).length * (parseFloat(props.font) || 10) * 0.55 });
          if (GM.has(k)) return (...a) => { gfxPush(["ctx", k, a]); };
          return props[k];
        },
        set(_, k, v) { props[k] = v; gfxPush(["set", k, v]); return true; },
      });
      canvas = {
        get width() { return cw; }, set width(v) { cw = v | 0; gfxPush(["size", cw, ch]); },
        get height() { return ch; }, set height(v) { ch = v | 0; gfxPush(["size", cw, ch]); },
        style: {}, focus() {}, getContext: () => ctx, addEventListener: addL, removeEventListener: rmL,
        getBoundingClientRect: () => ({ left: 0, top: 0, width: cw, height: ch }),
      };
      raf = (fn) => st(() => fn(performance.now()), 16);
      doc = { addEventListener: addL, removeEventListener: rmL, getElementById: () => canvas, querySelector: () => canvas, body: {},
              createElement: (tag) => (String(tag).toLowerCase() === "audio" ? new Aud() : { style: {}, addEventListener() {}, appendChild() {}, setAttribute() {} }) };
    }
    const win = { addEventListener: addL, removeEventListener: rmL, requestAnimationFrame: raf, cancelAnimationFrame: ct, innerWidth: 640, innerHeight: 480, Image: Img, Audio: Aud };

    try {
      const fn = new AsyncFunction("console", "input", "prompt", "alert", "setTimeout", "setInterval", "clearTimeout", "clearInterval", "canvas", "ctx", "document", "window", "requestAnimationFrame", "cancelAnimationFrame", "gfx", "Image", "Audio", "beep", code);
      await fn(con, inp, inp, alertFn, st, si, ct, ct, canvas, ctx, doc, win, raf, ct, gfxApi, Img, Aud, beep);
      if (live.size) await new Promise((r) => { waiter = r; });
    } catch (e) {
      report(e);
      live.forEach(stopHandle);
      live.clear();
    }
  },
};
</script>

<script id="w-sql" type="text/plain">
let SQL;

function cell(v) {
  if (v === null) return "NULL";
  if (v instanceof Uint8Array) return "<blob " + v.length + " bytes>";
  return String(v).replace(/\r?\n/g, "\\n");
}
function table(cols, rows) {
  const MAX = 1000;
  const shown = rows.length > MAX ? rows.slice(0, MAX) : rows;
  const body = shown.map((r) => r.map(cell));
  const w = cols.map((c) => c.length);
  for (const r of body) for (let i = 0; i < r.length; i++) if (r[i].length > w[i]) w[i] = r[i].length;
  const line = (r) => r.map((c, i) => c.padEnd(w[i])).join(" | ").replace(/\s+$/, "");
  let s = line(cols) + "\n" + w.map((n) => "-".repeat(n)).join("-+-") + "\n";
  for (const r of body) s += line(r) + "\n";
  if (rows.length > MAX) s += "... " + (rows.length - MAX) + " more rows not shown\n";
  return s + "(" + rows.length + (rows.length === 1 ? " row)" : " rows)") + "\n\n";
}

const LANG = {
  async init() {
    importScripts(BASE + "sql-wasm.js");
    SQL = await initSqlJs({ locateFile: (f) => BASE + f });
    const db = new SQL.Database();
    const v = db.exec("select sqlite_version()")[0].values[0][0];
    db.close();
    return "SQLite " + v;
  },
  async run(code) {
    const db = new SQL.Database();   // fresh in-memory database for every run
    let shown = 0;
    try {
      // input('prompt') is available inside queries: SELECT input('Name? ');
      db.create_function("input", (p) => { if (p !== null && p !== undefined) emit(String(p)); return readLine(); });
      for (const stmt of db.iterateStatements(code)) {
        const cols = stmt.getColumnNames();
        if (cols.length) {
          const rows = [];
          while (stmt.step()) rows.push(stmt.get());
          emit(table(cols, rows));
          shown++;
        } else {
          stmt.step();
        }
      }
      if (!shown) emit("OK\n");
    } catch (e) {
      throw new Error("SQL error: " + ((e && e.message) || e));
    } finally {
      db.close();
    }
  },
};
</script>

<script id="lua-prelude" type="text/plain">
-- Runs first inside every Lua run: routes print / io.write / io.read through the page.
local out, eout, rd = __out, __err, __in
__out, __err, __in = nil, nil, nil

local function join(sep, ...)
  local t = {}
  for i = 1, select("#", ...) do t[i] = tostring((select(i, ...))) end
  return table.concat(t, sep)
end

function print(...) out(join("\t", ...) .. "\n") end

local function writer(f)
  return function(...)
    for i = 1, select("#", ...) do
      local v = select(i, ...)
      local ty = type(v)
      if ty ~= "string" and ty ~= "number" then
        error("bad argument #" .. i .. " to 'write' (string expected, got " .. ty .. ")", 3)
      end
      f(tostring(v))
    end
  end
end
local wout, werr = writer(out), writer(eout)

local function readfmt(fmt)
  local s = rd()
  if s == nil then return nil end
  fmt = tostring(fmt or "l"):gsub("^%*", "")
  local c = fmt:sub(1, 1)
  if c == "n" then return tonumber(s) end
  if c == "L" or c == "a" then return s .. "\n" end
  return s
end
local function read(...)
  local n = select("#", ...)
  if n == 0 then return readfmt("l") end
  local res = {}
  for i = 1, n do
    local v = readfmt((select(i, ...)))
    res[i] = v
    if v == nil then return table.unpack(res, 1, i) end
  end
  return table.unpack(res, 1, n)
end

local stdout, stderr, stdin = io.stdout, io.stderr, io.stdin
io.write = function(...) wout(...) return stdout end
io.read = read
local fm = getmetatable(stdout).__index
local rawwrite, rawread = fm.write, fm.read
fm.write = function(self, ...)
  if self == stdout then wout(...) return self end
  if self == stderr then werr(...) return self end
  return rawwrite(self, ...)
end
fm.read = function(self, ...)
  if self == stdin then return read(...) end
  return rawread(self, ...)
end
</script>

<script id="w-ruby" type="text/plain">
let rmod, nextVM = null;

async function makeVM() {
  const { DefaultRubyVM } = self["ruby-wasm-wasi"];
  const { vm } = await DefaultRubyVM(rmod);
  vm.eval(PRELUDE);
  return vm;
}

const LANG = {
  async init() {
    importScripts(BASE + "browser.umd.js");
    // Ruby's stdout/stderr arrive through console.log / console.warn; send them to the page instead.
    console.log = (t) => emit(String(t));
    console.warn = (t) => emit(String(t), true);
    self.__readLine = () => readLine();
    self.gfx = gfxApi;
    const res = await fetch(BASE + "ruby+stdlib.wasm");
    if (!res.ok) throw new Error("Ruby download failed: " + res.status);
    rmod = await WebAssembly.compile(await res.arrayBuffer());
    nextVM = makeVM();
    const vm = await nextVM;
    return "Ruby " + vm.eval("RUBY_VERSION").toString();
  },
  async run(code) {
    const vm = await nextVM;      // a fresh interpreter for every run, prepared ahead of time
    nextVM = null;
    try {
      vm.eval(code);
    } catch (e) {
      const msg = String((e && e.message) || e);
      if (!/\(SystemExit\)/.test(msg)) throw e;
    } finally {
      nextVM = makeVM();
      nextVM.catch(() => {});
    }
  },
};
</script>

// #include <gfx.h> : C-style graphics, sound and input for JSCPP.
const gfxInclude = {

    const D = rt.doubleTypeLiteral, I = rt.intTypeLiteral, V = rt.voidTypeLiteral, S = rt.normalPointerType(rt.charTypeLiteral);
    const str = (p) => rt.getStringFromCharArray(p);

    const none = () => rt.val(I, 0);
    reg("gfx_window", [D, D], V, (rt, _t, w, h) => { gfxApi.window(w.v, h.v); });
    reg("gfx_clear", [D, D, D], V, (rt, _t, r, g, b) => { gfxApi.clear("rgb(" + r.v + "," + g.v + "," + b.v + ")"); });
    reg("gfx_color", [D, D, D], V, (rt, _t, r, g, b) => { gfxApi.color(r.v, g.v, b.v); });
    reg("gfx_line_width", [D], V, (rt, _t, w) => { gfxApi.line_width(w.v); });
    reg("gfx_line", [D, D, D, D], V, (rt, _t, a, b, c, d) => { gfxApi.line(a.v, b.v, c.v, d.v); });
    reg("gfx_rect", [D, D, D, D], V, (rt, _t, x, y, w, h) => { gfxApi.rect(x.v, y.v, w.v, h.v); });
    reg("gfx_rect_outline", [D, D, D, D], V, (rt, _t, x, y, w, h) => { gfxApi.rect(x.v, y.v, w.v, h.v, false); });
    reg("gfx_circle", [D, D, D], V, (rt, _t, x, y, r) => { gfxApi.circle(x.v, y.v, r.v); });
    reg("gfx_circle_outline", [D, D, D], V, (rt, _t, x, y, r) => { gfxApi.circle(x.v, y.v, r.v, false); });
    reg("gfx_text", [S, D, D, D], V, (rt, _t, s, x, y, size) => { gfxApi.text(str(s), x.v, y.v, size.v); });
    reg("gfx_flip", [], V, () => { gfxApi.flip(); });
    reg("gfx_sleep", [D], V, (rt, _t, ms) => { gfxApi.sleep(ms.v / 1000); });
    reg("gfx_key", [S], I, (rt, _t, s) => rt.val(I, gfxApi.key(str(s)) ? 1 : 0));
    reg("gfx_mouse_x", [], I, () => rt.val(I, gfxApi.mouse_x()));
    reg("gfx_mouse_y", [], I, () => rt.val(I, gfxApi.mouse_y()));
    reg("gfx_mouse_down", [], I, () => rt.val(I, gfxApi.mouse_down() ? 1 : 0));

const LANG = {

<script id="w-prolog" type="text/plain">
// Prolog: the file is the program. Lines starting with  ?-  are queries that run after it loads
// (all answers are printed). A  :- initialization(main).  directive works too.
const LANG = {
  async init() {
    self.window = self;   // the Prolog library looks for "window" when it loads
    importScripts(BASE + "prolog.js");
    return "Prolog (Tau)";
  },
  async run(code) {
    const session = pl.create(200000);
    const out = (t) => { emit(String(t)); return true; };
    session.streams.user_output.stream = { put: out, flush: () => true };
    session.streams.user_error.stream = { put: (t) => { emit(String(t), true); return true; }, flush: () => true };
    session.streams.user_input.stream = {
      buffer: "",
      get(len) { while (this.buffer.length < len) this.buffer += readLine() + "\n"; const t = this.buffer.substr(0, len); this.buffer = this.buffer.substr(len); return t; },
      eof() { return false; },
    };
    const queries = [];
    const program = code.split("\n").filter((l) => {
      const m = /^\s*\?-\s*(.*)$/.exec(l);
      if (m) { queries.push(m[1]); return false; }
      return true;
    }).join("\n");
    const fail = (e) => new Error(session.format_answer(e));
    await new Promise((res, rej) => session.consult(program, { script: false, success: res, error: (e) => rej(fail(e)) }));
    for (const q of queries) {
      emit("?- " + q + "\n");
      await new Promise((res, rej) => session.query(q, { success: res, error: (e) => rej(fail(e)) }));
      await new Promise((res) => {
        let n = 0;
        const next = () => session.answer({
          success: (a) => { n++; emit(session.format_answer(a) + "\n"); if (n >= 50) { emit("(first 50 answers shown)\n"); res(); } else next(); },
          fail: () => { if (!n) emit("false.\n"); res(); },
          error: (e) => { emit(session.format_answer(e) + "\n", true); res(); },
          limit: () => { emit("(inference limit reached)\n", true); res(); },
        });
        next();
      });
    }
  },
};
</script>

<script id="py-turtle" type="text/plain">
# turtle look-alike for Cronoff: draws straight into the gfx window (no animation, the picture appears as it is drawn).
import sys, types, math, time as _time
import gfx

_W, _H = 640, 480
_bg = "white"
_inited = False
_colormode = 1.0
_keys_down, _keys_up, _clicks, _timers = {}, {}, [], []
_KEYCODES = {"up": 38, "down": 40, "left": 37, "right": 39, "space": 32, "return": 13, "enter": 13, "escape": 27, "tab": 9, "shift": 16, "control": 17}

def _ensure():
    global _inited
    if not _inited:
        _inited = True
        gfx.window(_W, _H)
        gfx.clear(_css(_bg))

def _css(c):
    if isinstance(c, str):
        return c
    c = tuple(c)
    if _colormode == 1.0:
        c = tuple(int(round(v * 255)) for v in c[:3])
    return "rgb(%d,%d,%d)" % tuple(int(v) for v in c[:3])

def _col(args):
    if len(args) == 1:
        return args[0]
    return tuple(args)

class Turtle:
    def __init__(self, shape="classic", undobuffersize=1000, visible=True):
        self._x = 0.0; self._y = 0.0; self._h = 0.0
        self._down = True; self._pc = "black"; self._fc = "black"; self._size = 1
        self._fill = None; self._vis = visible

    def _move(self, x, y):
        _ensure()
        if self._down:
            gfx.color(_css(self._pc)); gfx.line_width(self._size)
            gfx.line(_W / 2 + self._x, _H / 2 - self._y, _W / 2 + x, _H / 2 - y)
        self._x, self._y = x, y
        if self._fill is not None:
            self._fill.append((x, y))

    def forward(self, d):
        r = math.radians(self._h)
        self._move(self._x + d * math.cos(r), self._y + d * math.sin(r))
    def backward(self, d): self.forward(-d)
    def right(self, a): self._h = (self._h - a) % 360
    def left(self, a): self._h = (self._h + a) % 360
    def goto(self, x, y=None):
        if y is None: x, y = x
        self._move(float(x), float(y))
    def setx(self, x): self.goto(x, self._y)
    def sety(self, y): self.goto(self._x, y)
    def setheading(self, a): self._h = a % 360
    def home(self): self.goto(0, 0); self._h = 0.0
    def circle(self, radius, extent=None, steps=None):
        if extent is None: extent = 360
        frac = abs(extent) / 360.0
        if steps is None: steps = 1 + int(min(11 + abs(radius) / 6.0, 59.0) * frac)
        w = 1.0 * extent / steps; w2 = 0.5 * w
        l = 2.0 * radius * math.sin(math.radians(w2))
        if radius < 0: l, w, w2 = -l, -w, -w2
        self.left(w2)
        for _ in range(steps):
            self.forward(l); self.left(w)
        self.right(w2)
    def dot(self, size=None, *color):
        _ensure()
        size = size or max(self._size + 4, self._size * 2)
        gfx.color(_css(_col(color) if color else self._pc))
        gfx.circle(_W / 2 + self._x, _H / 2 - self._y, size / 2.0)

<script id="py-prep" type="text/plain">
# Runs before your Python code: makes common things behave like normal Python.
import sys, time as _time
import gfx

_time.sleep = lambda s: gfx.sleep(s)   # time.sleep also shows pending drawing

async def _cronoff_prep(code):
    import ast, os
    try:
        tree = ast.parse(code)
    except SyntaxError:
        return code
    names = set()
    for n in ast.walk(tree):
        if isinstance(n, ast.Import):
            names.update(a.name.split(".")[0] for a in n.names)
        elif isinstance(n, ast.ImportFrom) and n.module and n.level == 0:
            names.add(n.module.split(".")[0])
    # requests / urllib: use the browser's network (the site must allow cross-origin requests)
    if names & {"requests", "urllib3"}:
        try:
            import pyodide_js
            await pyodide_js.loadPackage("pyodide-http")
            import pyodide_http
            pyodide_http.patch_all()
        except Exception:
            pass
    # matplotlib: plt.show() draws the figures in the graphics window
    if "matplotlib" in names:
        try:
            os.environ["MPLBACKEND"] = "Agg"
            import matplotlib
            matplotlib.use("Agg")
            import matplotlib.pyplot as plt
            def _show(*a, **k):
                import io, base64
                for num in plt.get_fignums():
                    buf = io.BytesIO()
                    plt.figure(num).savefig(buf, format="png", dpi=100)
                    gfx.picture("data:image/png;base64," + base64.b64encode(buf.getvalue()).decode())
                plt.close("all")
            plt.show = _show
        except Exception:
            pass
    # asyncio.run(main()) -> await main(): the run itself already lives inside an event loop
    if "asyncio" in names and "asyncio.run" in code:
        class _T(ast.NodeTransformer):
            def visit_FunctionDef(self, n): return n
            visit_AsyncFunctionDef = visit_Lambda = visit_ClassDef = visit_FunctionDef
            def visit_Call(self, n):
                self.generic_visit(n)
                f = n.func
                if isinstance(f, ast.Attribute) and f.attr == "run" and isinstance(f.value, ast.Name) and f.value.id == "asyncio" and n.args:
                    return ast.copy_location(ast.Await(value=n.args[0]), n)
                return n
        try:
            tree = _T().visit(tree)
            ast.fix_missing_locations(tree)
            code = ast.unparse(tree)
        except Exception:
            pass
    return code

# A small pygame look-alike for Cronoff. It draws through the gfx window (import gfx).
# Supported: display, draw (rect/circle/line/lines/polygon/ellipse), event, key, mouse, time.Clock, font text, Rect, Vector2, simple sounds.
import sys, types, time as _time
import gfx

def _mod(name, **attrs):
    m = types.ModuleType(name)
    m.__dict__.update(attrs)
    sys.modules[name] = m
    return m

class error(Exception):
    pass

_NAMED = {"black": (0, 0, 0), "white": (255, 255, 255), "red": (255, 0, 0), "green": (0, 128, 0), "lime": (0, 255, 0),
          "blue": (0, 0, 255), "yellow": (255, 255, 0), "gray": (128, 128, 128), "grey": (128, 128, 128),
          "orange": (255, 165, 0), "purple": (128, 0, 128), "pink": (255, 192, 203), "cyan": (0, 255, 255),
          "magenta": (255, 0, 255), "brown": (165, 42, 42)}

def Color(*a):
    if len(a) == 1:
        c = a[0]
        if isinstance(c, str):
            if c.startswith("#"):
                h = c[1:]
                return (int(h[0:2], 16), int(h[2:4], 16), int(h[4:6], 16), 255)
            return _NAMED.get(c.lower(), (0, 0, 0)) + (255,)
        a = tuple(c)
    return tuple(a) if len(a) > 3 else tuple(a) + (255,)

def _css(c):
    if isinstance(c, str):
        return c
    c = tuple(c)
    return "rgb(%d,%d,%d)" % (int(c[0]), int(c[1]), int(c[2]))

class Rect:
    def __init__(self, *a):
        if len(a) == 1:
            a = tuple(a[0])
        if len(a) == 2:
            (x, y), (w, h) = a
        else:
            x, y, w, h = a
        self.x, self.y, self.w, self.h = x, y, w, h
    width = property(lambda s: s.w, lambda s, v: setattr(s, "w", v))
    height = property(lambda s: s.h, lambda s, v: setattr(s, "h", v))
    left = property(lambda s: s.x, lambda s, v: setattr(s, "x", v))
    top = property(lambda s: s.y, lambda s, v: setattr(s, "y", v))
    right = property(lambda s: s.x + s.w, lambda s, v: setattr(s, "x", v - s.w))
    bottom = property(lambda s: s.y + s.h, lambda s, v: setattr(s, "y", v - s.h))
    centerx = property(lambda s: s.x + s.w // 2, lambda s, v: setattr(s, "x", v - s.w // 2))
    centery = property(lambda s: s.y + s.h // 2, lambda s, v: setattr(s, "y", v - s.h // 2))
    center = property(lambda s: (s.centerx, s.centery), lambda s, v: (setattr(s, "centerx", v[0]), setattr(s, "centery", v[1])) and None)
    topleft = property(lambda s: (s.x, s.y), lambda s, v: (setattr(s, "x", v[0]), setattr(s, "y", v[1])) and None)
    size = property(lambda s: (s.w, s.h))
    def __iter__(self): return iter((self.x, self.y, self.w, self.h))
    def __getitem__(self, i): return (self.x, self.y, self.w, self.h)[i]
    def __eq__(self, o): return tuple(self) == tuple(o)
    def __repr__(self): return "<rect(%s, %s, %s, %s)>" % tuple(self)
    def copy(self): return Rect(self.x, self.y, self.w, self.h)
    def move(self, dx, dy): return Rect(self.x + dx, self.y + dy, self.w, self.h)
    def move_ip(self, dx, dy): self.x += dx; self.y += dy
    def inflate(self, dx, dy): return Rect(self.x - dx // 2, self.y - dy // 2, self.w + dx, self.h + dy)
    def inflate_ip(self, dx, dy): self.x -= dx // 2; self.y -= dy // 2; self.w += dx; self.h += dy
    def collidepoint(self, *p):
        if len(p) == 1: p = tuple(p[0])
        return self.x <= p[0] < self.x + self.w and self.y <= p[1] < self.y + self.h
    def colliderect(self, o):
        o = Rect(o)
        return self.x < o.x + o.w and o.x < self.x + self.w and self.y < o.y + o.h and o.y < self.y + self.h
    def contains(self, o):
        o = Rect(o)
        return o.x >= self.x and o.y >= self.y and o.x + o.w <= self.x + self.w and o.y + o.h <= self.y + self.h

class Vector2:
    def __init__(self, x=0, y=0):
        if not isinstance(x, (int, float)): x, y = x
        self.x, self.y = x, y
    def __iter__(self): return iter((self.x, self.y))
    def __getitem__(self, i): return (self.x, self.y)[i]
    def __add__(self, o): return Vector2(self.x + o[0], self.y + o[1])
    def __sub__(self, o): return Vector2(self.x - o[0], self.y - o[1])
    def __mul__(self, k): return Vector2(self.x * k, self.y * k)
    __rmul__ = __mul__
    def __truediv__(self, k): return Vector2(self.x / k, self.y / k)
    def __neg__(self): return Vector2(-self.x, -self.y)
    def __eq__(self, o): return (self.x, self.y) == tuple(o)
    def __repr__(self): return "<Vector2(%s, %s)>" % (self.x, self.y)
    def length(self): return (self.x ** 2 + self.y ** 2) ** 0.5
    def normalize(self):
        n = self.length()
        return Vector2(self.x / n, self.y / n) if n else Vector2(0, 0)
    def distance_to(self, o): return (self - o).length()
    def dot(self, o): return self.x * o[0] + self.y * o[1]

class _Text:
    def __init__(self, text, color, size):
        self.text, self.color, self.size = text, color, size
    def get_width(self): return int(len(self.text) * self.size * 0.55)
    def get_height(self): return self.size
    def get_size(self): return (self.get_width(), self.get_height())
    def get_rect(self, **kw):
        r = Rect(0, 0, self.get_width(), self.get_height())
        for k, v in kw.items(): setattr(r, k, v)
        return r

class Surface:
    def __init__(self, size=None, flags=0, depth=0, _screen=False):
        if not _screen:
            raise NotImplementedError("pygame.Surface for off-screen images is not supported in Cronoff yet. Draw on the screen instead.")
        self._w, self._h = size
    def get_width(self): return self._w
    def get_height(self): return self._h
    def get_size(self): return (self._w, self._h)
    def get_rect(self, **kw):
        r = Rect(0, 0, self._w, self._h)
        for k, v in kw.items(): setattr(r, k, v)
        return r
    def fill(self, color, rect=None):
        r = Rect(rect) if rect is not None else Rect(0, 0, self._w, self._h)
        gfx.color(_css(color)); gfx.rect(r.x, r.y, r.w, r.h)
    def blit(self, src, dest, area=None):
        if not isinstance(src, _Text):
            raise NotImplementedError("Only rendered text can be blitted in Cronoff (no image surfaces yet).")
        p = dest.topleft if isinstance(dest, Rect) else tuple(dest)
        gfx.color(_css(src.color)); gfx.text(src.text, p[0], p[1], src.size)
    def set_at(self, pos, color):
        gfx.color(_css(color)); gfx.rect(pos[0], pos[1], 1, 1)

_screen = None

def _stroke(width):
    gfx.line_width(max(1, int(width)))

def _rect(surface, color, rect, width=0, border_radius=0, **kw):
    r = Rect(rect); gfx.color(_css(color))
    if width: _stroke(width); gfx.rect(r.x, r.y, r.w, r.h, False)
    else: gfx.rect(r.x, r.y, r.w, r.h)
    return r
def _circle(surface, color, center, radius, width=0, **kw):
    gfx.color(_css(color))
    if width: _stroke(width); gfx.circle(center[0], center[1], radius, False)
    else: gfx.circle(center[0], center[1], radius)
    return Rect(center[0] - radius, center[1] - radius, radius * 2, radius * 2)
def _ellipse(surface, color, rect, width=0):
    r = Rect(rect); gfx.color(_css(color))
    if width: _stroke(width); gfx.ellipse(r.centerx, r.centery, r.w / 2, r.h / 2, False)
    else: gfx.ellipse(r.centerx, r.centery, r.w / 2, r.h / 2)
    return r
def _line(surface, color, start, end, width=1):
    gfx.color(_css(color)); _stroke(width); gfx.line(start[0], start[1], end[0], end[1])
def _lines(surface, color, closed, points, width=1):
    pts = list(points)
    for i in range(len(pts) - 1): _line(surface, color, pts[i], pts[i + 1], width)
    if closed and len(pts) > 2: _line(surface, color, pts[-1], pts[0], width)

    else: gfx.poly_end()

def _get_events():
    global _pk, _pb, _pp
    out = []
    cur = {k for k, code in _K.items() if gfx.keycode(code)}
    for k in sorted(cur - _pk): out.append(Event(KEYDOWN, key=k, unicode=chr(k) if 32 <= k < 127 else "", mod=0))
    for k in sorted(_pk - cur): out.append(Event(KEYUP, key=k, mod=0))

    _pp = pos

        if (b & bit) and not (_pb & bit): out.append(Event(MOUSEBUTTONDOWN, pos=pos, button=num))
        if (_pb & bit) and not (b & bit): out.append(Event(MOUSEBUTTONUP, pos=pos, button=num))

class Clock:
    def __init__(self):

    def tick(self, fps=0):

        if fps:
            wait = 1000.0 / fps - (now - self._last)
            if wait > 0:
                gfx.sleep(wait / 1000.0)
            else:
                gfx.flip()
            now = _time.time() * 1000.0
        else:
            gfx.flip()
        self._dt = now - self._last; self._last = now
        return int(self._dt)
    def tick_busy_loop(self, fps=0): return self.tick(fps)
    def get_time(self): return int(self._dt)
    def get_fps(self): return 1000.0 / self._dt if self._dt else 0.0

<script id="ruby-prelude" type="text/plain">
# Runs first inside every Ruby run: routes output and gets through the page.
require "js"
$stdout.sync = true
$stderr.sync = true

class CronoffStdin
  def gets(*)
    JS.global.call(:__readLine).to_s + "\n"
  end
  def readline(*)
    gets
  end
  def read(*)
    gets
  end
  def each_line
    return to_enum(:each_line) unless block_given?
    loop { yield gets }
  end
  def tty?
    false
  end
end

module Kernel
  def gets(*)
    $stdin.gets
  end
  def readline(*)
    $stdin.gets
  end
end

$stdin = CronoffStdin.new
Object.send(:remove_const, :STDIN)
STDIN = $stdin

# Graphics window: Gfx.window(400, 300); Gfx.rect(10, 10, 50, 50); Gfx.flip; Gfx.sleep(0.016) ...
module Gfx
  G = JS.global[:gfx]
  %w[window clear color line_width line rect circle text flip sleep].each do |n|
    define_singleton_method(n) { |*a| G.call(n, *a); nil }
  end
  def self.key?(k)
    G.call(:key, k.to_s).to_s == "true"
  end
  def self.mouse_x
    G.call(:mouse_x).to_s.to_f.to_i
  end
  def self.mouse_y
    G.call(:mouse_y).to_s.to_f.to_i
  end
  def self.mouse_down?
    G.call(:mouse_down).to_s == "true"
  end
end

  // The extension is whatever the user types: it picks the language. No extension typed = keep the old one.
  function cleanName(s, old) {
    s = s.replace(/[\\/:*?"<>|\x00-\x1f]/g, "").trim().replace(/\s+/g, "_");
    if (!s) return null;
    const e = splitExt(old)[1];
    if (!s.includes(".") && e) s = s.slice(0, 60 - e.length) + e;
    return s.slice(0, 60);
  }
  function uniqueName(name, skip) {
    const taken = new Set(files.map((f, i) => (i === skip ? "" : f.name.toLowerCase())));
    if (!taken.has(name.toLowerCase())) return name;
    const [base, ext] = splitExt(name);
    let n = 2;
    while (taken.has((base + "_" + n + ext).toLowerCase())) n++;
    return base + "_" + n + ext;
  }
  function switchTo(i) {
    active = i;
    codeEl.value = files[i].code;
    codeEl.scrollTop = 0;
    codeEl.scrollLeft = 0;
    refresh();
    applyLayout();
    renderTabs();
    saveFiles();
    syncLang();
  }
  function addTab() {
    if (files.length >= MAX_TABS) return;
    const k = curKey();
    files.push({ name: uniqueName("untitled." + (k ? LANGS[k].exts[0] : "py"), -1), code: "" });
    switchTo(files.length - 1);
    codeEl.focus();
  }
  function closeTab(i) {
    if (files.length < 2) return;
    if (!confirm('Close "' + files[i].name + '"? Its code will be deleted.')) return;
    files.splice(i, 1);
    if (i < active) active -= 1;
    active = Math.min(active, files.length - 1);
    switchTo(active);
  }
  function startRename(i, label) {
    renaming = true;
    const inp = document.createElement("input");
    inp.id = "fnameInput";
    inp.value = files[i].name;
    inp.maxLength = 60;
    inp.setAttribute("aria-label", "File name");
    label.replaceWith(inp);
    inp.focus();
    inp.select();
    let done = false;
    const finish = (save) => {
      if (done) return;
      done = true;
      renaming = false;
      if (save) {
        const n = cleanName(inp.value, files[i].name);
        if (n) { files[i].name = uniqueName(n, i); saveFiles(); }
      }
      label.textContent = files[i].name;
      inp.replaceWith(label);
      if (save) { refresh(); syncLang(); }
    };
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      else if (e.key === "Escape") finish(false);
    });
    inp.addEventListener("blur", () => finish(true));
  }
  function renderTabs() {
    tabsEl.textContent = "";
    files.forEach((f, i) => {
      const t = document.createElement("div");
      t.className = "ftab" + (i === active ? " active" : "");
      t.setAttribute("role", "tab");
      t.tabIndex = 0;
      const label = document.createElement("span");
      label.textContent = f.name;
      label.title = i === active ? "Click to rename" : f.name;
      t.appendChild(label);
      if (files.length > 1) {
        const x = document.createElement("button");
        x.className = "x";
        x.textContent = "\u00d7";
        x.title = "Close";
        x.setAttribute("aria-label", "Close " + f.name);
        x.addEventListener("click", (e) => { e.stopPropagation(); closeTab(i); });
        t.appendChild(x);
      }
      const activate = () => {
        if (renaming) return;
        if (i === active) startRename(i, label); else switchTo(i);
      };
      t.addEventListener("click", activate);
      t.addEventListener("keydown", (e) => {
        if (e.target === t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); activate(); }
      });
      tabsEl.appendChild(t);
    });
    const plus = document.createElement("button");
    plus.id = "newTab";
    plus.textContent = "+";
    plus.title = "New file";
    plus.setAttribute("aria-label", "New file");
    plus.disabled = files.length >= MAX_TABS;
    plus.addEventListener("click", addTab);
    tabsEl.appendChild(plus);
    const act = tabsEl.querySelector(".ftab.active");
    if (act) act.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  renderTabs();

  /* ---------- download ---------- */
  $("download").addEventListener("click", () => {
    const blob = new Blob([codeEl.value], { type: (curKey() && LANGS[curKey()].mime) || "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = files[active].name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  /* ---------- output + worker ---------- */
  function write(text, cls) {
    const span = document.createElement("span");
    if (cls) span.className = cls;
    span.textContent = text;
    outEl.appendChild(span);
    outEl.scrollTop = outEl.scrollHeight;
  }

  let offlineReady = false;
  let serverReady = false;   // is a code server connected? (only then are server languages offered)
  const rt = {};          // one runtime per language: { worker, i32, bytes, state, label }
  const offline = {};     // per language: cached for offline use?
  let running = null;     // language key that is running right now
  function hideInput() { inputRow.classList.remove("show"); inputEl.value = ""; }
  function curKey() { return langOf(files[active].name); }

  function workerSource(key) {
    const L = LANGS[key];
    return $("w-common").textContent + (L.extra ? L.extra() : "") + $(L.worker).textContent + (L.after ? L.after() : "");
  }

  function updateUI() {
    const k = curKey(), r = k && rt[k];
    const nm = k ? LANGS[k].name : "Code";
    codeEl.setAttribute("aria-label", nm + " code (Ctrl+Enter to run)");
    inputEl.setAttribute("aria-label", (running ? LANGS[running].name : nm) + " input");
    langSel.value = k || "";
    langSel.disabled = !!running;
    const rem = k && LANGS[k].remote;
    stdinBox.style.display = rem ? "block" : "none";
    runBtn.disabled = !!running || (rem ? (!serverReady || !navigator.onLine) : (!r || r.state !== "ready"));
    stopBtn.disabled = !running;
    let t;
    if (rem && !serverReady) t = nm + " needs a code server, which is not connected.";
    else if (rem) t = navigator.onLine ? nm + " \u00b7 runs on the code server (needs internet)" : nm + " needs internet (code server). You are offline.";
    else if (!crossOriginIsolated) t = "Missing vercel.json headers. Upload vercel.json and redeploy.";
    else if (!k) t = "Unknown file type. Rename it to " + EXT_LIST + ".";
    else if (!r || r.state === "loading") t = "Loading " + nm + "...";
    else if (r.state === "fail") t = "Failed to load " + nm + ". Check your connection and reload.";
    else t = r.label + (offline[k] ? " \u00b7 offline ready" : "");
    statusEl.textContent = t;
  }

  function startRt(key) {
    if (!crossOriginIsolated) { updateUI(); return; }
    const r = rt[key] || (rt[key] = {});
    if (r.worker) r.worker.terminate();
    const sab = new SharedArrayBuffer(8 + 65536);
    r.i32 = new Int32Array(sab);
    r.bytes = new Uint8Array(sab, 8);
    r.gsab = new SharedArrayBuffer(16 + 256);   // mouse + key state for the graphics window
    r.gi32 = new Int32Array(r.gsab, 0, 4);
    r.gkeys = new Uint8Array(r.gsab, 16, 256);
    const url = URL.createObjectURL(new Blob([workerSource(key)], { type: "text/javascript" }));
    r.worker = new Worker(url);
    r.worker.onmessage = (ev) => onMsg(key, ev);
    r.worker.postMessage({ type: "init", sab, gsab: r.gsab });
    r.state = "loading"; r.label = "";
    updateUI();
  }
  // Load the runtime for the open file's language (once; retried if it failed).
  function syncLang() {
    const k = curKey();
    if (k && !LANGS[k].remote && (!rt[k] || rt[k].state === "fail")) startRt(k);
    updateUI();
  }

  function onMsg(key, ev) {
    const m = ev.data, r = rt[key];
    if (m.type === "ready") {
      r.state = "ready"; r.label = m.version;
      updateUI();
    } else if (m.type === "fail") {
      r.state = "fail";
      updateUI();
    } else if (m.type === "gfx") {
      gfxApply(m.cmds);
    } else if (m.type === "gfxshow") {
      gfxShow();
    } else if (m.type === "snd") {
      sndApply(m.cmd);
    } else if (m.type === "out") {
      write(m.text, m.err ? "err" : "");
    } else if (m.type === "input") {
      inputRow.classList.add("show");
      inputEl.focus();
    } else if (m.type === "done") {
      write("--- finished ---\n", "info");
      running = null; hideInput(); updateUI();
    }
  }

  function run() {
    if (runBtn.disabled) return;
    const k = curKey();
    if (LANGS[k].remote) { runRemote(k); return; }
    running = k;
    outEl.textContent = "";
    gfxReset(k === "js" || k === "ts");
    sndReset(); sndInit();
    rt[k].gkeys.fill(0);
    updateUI();
    if (offc) rt[k].worker.postMessage({ type: "run", code: codeEl.value, canvas: offc }, [offc]);
    else rt[k].worker.postMessage({ type: "run", code: codeEl.value });
  }

  function send() {
    const r = rt[running];
    if (!r) return;
    const enc = new TextEncoder().encode(inputEl.value).slice(0, 65536);
    write(inputEl.value + "\n", "info");
    r.bytes.set(enc);
    r.i32[1] = enc.length;
    Atomics.store(r.i32, 0, 1);
    Atomics.notify(r.i32, 0);
    hideInput();
  }

  /* ---------- graphics window: programs draw here, keys and mouse go back to them ---------- */
  try { console.info("Cronoff - made by yehon106"); } catch (e) {}   // decorative, must never stop the page
  const gfxWrap = $("gfxWrap");
  let gfxEl = $("gfx"), gctx = gfxEl.getContext("2d"), offc = null;
  const G_METHODS = new Set("save restore scale rotate translate transform setTransform resetTransform beginPath closePath moveTo lineTo bezierCurveTo quadraticCurveTo arc arcTo ellipse rect roundRect fill stroke clip clearRect fillRect strokeRect fillText strokeText setLineDash".split(" "));
  const G_PROPS = new Set("fillStyle strokeStyle lineWidth font textAlign textBaseline globalAlpha lineCap lineJoin miterLimit lineDashOffset globalCompositeOperation shadowBlur shadowColor shadowOffsetX shadowOffsetY imageSmoothingEnabled".split(" "));
  const gImgs = new Map();
  let picQ = Promise.resolve(), picW = 0, picH = 0;
  // A fresh canvas for every run. JavaScript gets the real thing (OffscreenCanvas) when the browser has it.
  function gfxReset(forJs) {
    gfxWrap.style.display = "none";
    const c = document.createElement("canvas");
    c.id = "gfx"; c.width = 640; c.height = 480; c.tabIndex = 0;
    c.setAttribute("aria-label", "Graphics window");
    gfxWrap.replaceChildren(c);
    gfxEl = c; gctx = null; offc = null;
    picQ = Promise.resolve(); picW = 0; picH = 0;
    if (forJs && c.transferControlToOffscreen) offc = c.transferControlToOffscreen();
    else gctx = c.getContext("2d");
  }
  function gfxShow() {
    const wasHidden = gfxWrap.style.display !== "block";
    gfxWrap.style.display = "block";
    if (wasHidden) gfxEl.focus({ preventScroll: true });
  }
  function gfxApply(cmds) {
    gfxShow();
    if (!gctx) return;
    for (const c of cmds) {
      try {
        if (c[0] === "size") {
          gfxEl.width = Math.min(4096, Math.max(1, c[1] | 0));
          gfxEl.height = Math.min(4096, Math.max(1, c[2] | 0));
        } else if (c[0] === "ctx") {
          if (G_METHODS.has(c[1])) gctx[c[1]](...c[2]);
        } else if (c[0] === "set") {
          if (G_PROPS.has(c[1])) gctx[c[1]] = c[2];
        } else if (c[0] === "grad") {
          const g = gctx.createLinearGradient(c[1], c[2], c[3], c[4]);
          g.addColorStop(0, c[5]); g.addColorStop(1, c[6]);
          gctx.fillStyle = g; gctx.strokeStyle = g;
        } else if (c[0] === "pic") {
          const el = gfxEl, url = c[1];
          picQ = picQ.then(() => new Promise((res) => {
            const im = new Image();
            im.onerror = () => res();
            im.onload = () => {
              if (el === gfxEl && gctx) {
                const w = Math.max(picW, im.width), h = picH + im.height;
                let keep = null;
                if (picH) { keep = document.createElement("canvas"); keep.width = el.width; keep.height = picH; keep.getContext("2d").drawImage(el, 0, 0); }
                el.width = w; el.height = h;
                gctx.fillStyle = "#fff"; gctx.fillRect(0, 0, w, h);
                if (keep) gctx.drawImage(keep, 0, 0);
                gctx.drawImage(im, 0, picH);
                picW = w; picH = h;
              }
              res();
            };
            im.src = url;
          }));
        } else if (c[0] === "img") {
          let im = gImgs.get(c[1]);
          if (!im) { im = new Image(); im.crossOrigin = "anonymous"; im.src = c[1]; gImgs.set(c[1], im); }
          if (im.complete && im.naturalWidth) {
            if (c[4]) gctx.drawImage(im, c[2], c[3], c[4], c[5] || c[4]);
            else gctx.drawImage(im, c[2], c[3]);
          }
        }
      } catch {}
    }
  }
  function sendEv(ev) { const r = rt[running]; if (r) r.worker.postMessage({ type: "ev", ev }); }
  function gpos(e) {
    const b = gfxEl.getBoundingClientRect();
    return { x: Math.round((e.clientX - b.left) * gfxEl.width / (b.width || 1)), y: Math.round((e.clientY - b.top) * gfxEl.height / (b.height || 1)) };
  }
  ["mousemove", "mousedown", "mouseup", "click"].forEach((t) => gfxWrap.addEventListener(t, (e) => {
    if (!running || e.target !== gfxEl) return;
    const p = gpos(e), r = rt[running];
    if (r && r.gi32) { r.gi32[0] = p.x; r.gi32[1] = p.y; r.gi32[2] = e.buttons; }
    if (t === "mousedown") gfxEl.focus();
    sendEv({ type: t, x: p.x, y: p.y, offsetX: p.x, offsetY: p.y, clientX: p.x, clientY: p.y, button: e.button, buttons: e.buttons });
  }));
  gfxWrap.addEventListener("contextmenu", (e) => e.preventDefault());
  ["keydown", "keyup"].forEach((t) => gfxWrap.addEventListener(t, (e) => {
    if (!running || e.key === "Tab" || e.ctrlKey || e.metaKey || e.altKey) return;
    e.preventDefault();
    const r = rt[running];
    if (r && r.gkeys) r.gkeys[e.keyCode & 255] = t === "keydown" ? 1 : 0;
    sendEv({ type: t, key: e.key, code: e.code, keyCode: e.keyCode, which: e.keyCode, repeat: e.repeat });
  }));
  gfxWrap.addEventListener("focusout", () => { const r = rt[running]; if (r && r.gkeys) r.gkeys.fill(0); });

  /* ---------- sound: beeps and audio files, played by the page ---------- */
  let actx = null;
  const auds = new Map();
  function sndInit() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
    } catch {}
  }
  function sndReset() {
    for (const a of auds.values()) { try { a.pause(); } catch {} }
    auds.clear();
  }
  function sndApply(c) {
    try {
      if (c[0] === "beep") {
        sndInit();
        if (!actx) return;
        const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
        const d = Math.min(5, Math.max(0.01, c[2] / 1000)), v = Math.min(1, Math.max(0, c[3]));
        o.type = ["sine", "square", "sawtooth", "triangle"].includes(c[4]) ? c[4] : "square";
        o.frequency.value = Math.min(20000, Math.max(20, c[1]));
        g.gain.setValueAtTime(v, t); g.gain.linearRampToValueAtTime(0.0001, t + d);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t + d);
      } else if (c[0] === "new") {
        const a = new Audio();
        a.crossOrigin = "anonymous";
        if (c[2]) a.src = c[2];
        auds.set(c[1], a);
      } else {
        const a = auds.get(c[1]);
        if (!a) return;
        if (c[0] === "src") a.src = c[2];
        else if (c[0] === "play") { sndInit(); const p = a.play(); if (p && p.catch) p.catch(() => {}); }
        else if (c[0] === "pause") a.pause();
        else if (c[0] === "set" && ["volume", "loop", "muted", "currentTime", "playbackRate"].includes(c[2])) a[c[2]] = c[3];
      }
    } catch {}
  }

  /* ---------- code server: only for languages that cannot run in the browser ---------- */
  const stdinBox = $("stdinBox");
  let remoteCtl = null;
  async function runRemote(k) {
    const L = LANGS[k], ctl = new AbortController();
    remoteCtl = ctl; running = k;
    outEl.textContent = "";
    gfxReset(false); sndReset();
    updateUI();
    write("Running " + L.name + " on the code server...\n", "info");
    try {
      const access = localStorage.getItem("cronoff-access") || "";
      const r = await fetch("/api/run", {
        method: "POST", signal: ctl.signal,
        headers: Object.assign({ "Content-Type": "application/json" }, access ? { "x-access-code": access } : {}),
        body: JSON.stringify({ lang: L.remote, code: codeEl.value, stdin: stdinBox.value }),
      });
      const j = await r.json().catch(() => ({}));
      outEl.textContent = "";
      if (r.status === 401) {
        const c = prompt("This code server needs an access code:");
        if (c) { localStorage.setItem("cronoff-access", c); write("Saved. Press Run again.\n", "info"); }
        else write("Access code needed.\n", "err");
      } else if (!r.ok) {
        write((j.message || "The code server could not run this (" + r.status + ").") + "\n", "err");
      } else {
        if (j.stdout) write(j.stdout.endsWith("\n") ? j.stdout : j.stdout + "\n", "");
        if (j.stderr) write(j.stderr.endsWith("\n") ? j.stderr : j.stderr + "\n", "err");
        if (j.note) write(j.note + "\n", "info");
        write("--- finished" + (j.code ? " (exit code " + j.code + ")" : "") + " ---\n", "info");
      }
    } catch (e) {
      if (e && e.name === "AbortError") return;
      outEl.textContent = "";
      write(navigator.onLine ? "Could not reach the code server.\n" : L.name + " needs internet. You are offline.\n", "err");
    } finally {
      if (remoteCtl === ctl) { remoteCtl = null; running = null; updateUI(); }
    }
  }
  window.addEventListener("online", () => updateUI());
  window.addEventListener("offline", () => updateUI());

  const langSel = $("lang");
  function buildLangOptions() {
    while (langSel.options.length > 1) langSel.remove(1);
    for (const k in LANGS) {
      if (LANGS[k].remote && !serverReady) continue;
      const o = document.createElement("option");
      o.value = k; o.textContent = LANGS[k].name + (LANGS[k].remote ? " (online)" : "");
      langSel.appendChild(o);
    }
    langSel.value = curKey() || "";
  }
  buildLangOptions();
  // Picking a language swaps the open file's extension (the language always follows the extension).
  langSel.addEventListener("change", () => {
    if (running || !langSel.value) { updateUI(); return; }
    files[active].name = uniqueName(splitExt(files[active].name)[0] + "." + LANGS[langSel.value].exts[0], active);
    saveFiles(); renderTabs(); refresh(); syncLang();
    codeEl.focus();
  });

  runBtn.addEventListener("click", run);
  stopBtn.addEventListener("click", () => {
    if (!running) return;
    const k = running;
    running = null;
    write("--- stopped ---\n", "info");
    sndReset();
    hideInput();
    if (LANGS[k].remote) { if (remoteCtl) remoteCtl.abort(); remoteCtl = null; updateUI(); return; }
    startRt(k);
  });
  $("send").addEventListener("click", send);
  inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); send(); } });
  $("clear").addEventListener("click", () => { outEl.textContent = ""; });
  $("reset").addEventListener("click", () => {
    const code = "";
    codeEl.value = code; refresh(); applyLayout();
    files[active].code = code; saveFiles();
  });

  codeEl.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); return; }
    if (e.key === "Tab") {
      e.preventDefault();
      if (lineLenAfter(4) > maxCols()) return;
      codeEl.setRangeText("    ", codeEl.selectionStart, codeEl.selectionEnd, "end");
      codeEl.dispatchEvent(new Event("input"));
    }
  });

  syncLang();
  fetch("/api/run").then((x) => (x.ok ? x.json() : null)).then((j) => { serverReady = !!(j && j.ready); buildLangOptions(); updateUI(); }).catch(() => {});

  /* ---------- offline support ---------- */
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js")
      .then(() => navigator.serviceWorker.ready)
      .then(async () => {
        for (const k of Object.keys(LANGS)) if (LANGS[k].probe) offline[k] = !!(await caches.match(LANGS[k].probe));
        offlineReady = true;
        updateUI();
      })
      .catch(() => {});
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  }
</script>
</body>
</html>
